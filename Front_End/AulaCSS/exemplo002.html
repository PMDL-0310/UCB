<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo 02 CSS</title>
    <style type="text/css">
        ul{
            list-style: none;
        }
        li{
            margin-bottom: 12px;
        }
        a, a:active, a:visited{
            background-color: blue;
            text-decoration: none;
            color: white;
            font-size: 10pt;
            border-radius: 8px;
            padding: 12px 25px;
            display: inline-block;
            transition: 0.3s;
        }
        a:hover{
            background-color: #084898;
            color: red;
            transform: translateX(8px);
        }
    </style>
</head>
<body>
    <h2>Menu</h2>

    <ul>
        <li><a href="a">item 01</a></li>
        <li><a href="a">item 02</a></li>
        <li><a href="a">item 03</a></li>
        <li><a href="a">item 04</a></li>
    </ul>
    
</body>
</html>
