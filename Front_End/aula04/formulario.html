<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Trabalhando com formulários</h1>
    <hr>

    <form action="method">
        <label nome:></label>
        <input type="text" name="nome" maxlength="10" minlength="2" placeholder="Digite aqui seu nome" required><br></br>
        <label Endereço:></label>
        <input type="text" name="Endereço" size="40" placeholder="Digite seu endereço"><br><br>
        <label E-mail:></label>
        <input type="email" name="email" placeholder="Digite seu email" required><br><br>
        <label Senha:></label>
        <input type="password" name="senha" maxlength="8" placeholder="Digite sua senha" required>
        <label Confirme a senha:></label>
        <input type="password" name="conf-senha" placeholder="Confirme sua senha" required><br><br>
        <label Data de Nascimento:></label>
        <input type="date" name="dt-nasc" required><br></br>
        <h3>Quais são as suas cores favoritas?</h3>

        <input type="checkbox" value="Amarelo" name="cor-fav"><label>Amarelo</label><br>
        <input type="checkbox" value="Azul" name="cor-fav"><label>Azul</label><br>
        <input type="checkbox" value="Verde" name="cor-fav"><label>Verde</label><br><br>

        <label Sexo:></label><input type="radio" name="Sexo" value="Masc"><label>Masculino</label>
        <input type="radio" name="Sexo" value="Femin"><label>Feminino</label>
        <br><br>
        <label>Região administrativa</label>
        <select name="ra" required>
            <option value="">SELECIONE</option>
            <option value="taguatinga">Taguatinga</option>
            <option value="aguas Claras">Aguas Claras</option>
            <option value="gama">Gama</option>
            <option value="ceilândia">Ceilândia</option>
            <option value="brazlandia">Brazlandia</option>
        </select>
        <br><br>
        <h3>Deixe aqui seu comentário</h3>
        <textarea name="comentario" cols="40" rows="30"></textarea>
        <br><br>
        <input type="file">


        <br><br>
        <input type="submit">
    </form>
</body>
</html>
